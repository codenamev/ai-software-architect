version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/mcp"
    schedule:
      interval: "weekly"
    labels: ["loop:deps"]
    groups:
      mcp:
        patterns: ["*"]
  - package-ecosystem: "npm"
    directory: "/tools"
    schedule:
      interval: "weekly"
    labels: ["loop:deps"]
    groups:
      tools:
        patterns: ["*"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels: ["loop:deps"]
    groups:
      github-actions:
        patterns: ["*"]
