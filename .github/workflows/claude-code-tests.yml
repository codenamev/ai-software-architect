name: Claude Code Integration Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  claude-setup-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project-type: [nodejs, rails, python, generic]
        
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Setup Node.js (for all project types)
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        
    - name: Setup Ruby (for Rails tests)
      if: matrix.project-type == 'rails'
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.1'
        
    - name: Setup Python (for Python tests)
      if: matrix.project-type == 'python'
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
        
    - name: Create test project fixtures
      run: |
        mkdir -p test-projects/${{ matrix.project-type }}
        cd test-projects/${{ matrix.project-type }}
        
        case "${{ matrix.project-type }}" in
          nodejs)
            echo '{"name": "test-app", "version": "1.0.0", "dependencies": {"express": "^4.18.0"}}' > package.json
            ;;
          rails)
            echo 'source "https://rubygems.org"' > Gemfile
            echo 'gem "rails", "~> 7.0"' >> Gemfile
            echo 'gem "sqlite3"' >> Gemfile
            ;;
          python)
            echo 'flask==2.3.0' > requirements.txt
            echo 'django==4.2.0' >> requirements.txt
            ;;
          generic)
            echo '# Generic project' > README.md
            ;;
        esac
        
    - name: Copy framework to test project
      run: |
        cd test-projects/${{ matrix.project-type }}
        cp -r ../../.architecture ./.architecture
        cp -r ../../.coding-assistants ./.coding-assistants

        # Verify copy succeeded
        echo "Verifying framework copy..."
        ls -la | grep -E "(architecture|coding-assistants)"
        ls -la .coding-assistants/ | grep -E "(cursor|codex)"

    - name: Simulate Claude Code setup process
      run: |
        cd test-projects/${{ matrix.project-type }}
        
        # Step 1: Detect Setup Context
        echo "=== Testing Setup Context Detection ==="
        if [ -d ".architecture" ]; then
          echo "✓ Framework directory detected"
        else
          echo "✗ Framework directory missing"
          exit 1
        fi
        
        # Step 2: Analyze Target Project
        echo "=== Testing Project Analysis ==="
        case "${{ matrix.project-type }}" in
          nodejs)
            if [ -f "package.json" ]; then
              echo "✓ Node.js project detected"
            else
              echo "✗ package.json not found"
              exit 1
            fi
            ;;
          rails)
            if grep -q "rails" Gemfile 2>/dev/null; then
              echo "✓ Rails project detected"
            else
              echo "✗ Rails not detected in Gemfile"
              exit 1
            fi
            ;;
          python)
            if [ -f "requirements.txt" ]; then
              echo "✓ Python project detected"
            else
              echo "✗ requirements.txt not found"
              exit 1
            fi
            ;;
        esac
        
    - name: Test framework installation simulation
      run: |
        cd test-projects/${{ matrix.project-type }}
        
        # Step 3: Framework Installation (simulate moving from nested to root)
        echo "=== Testing Framework Installation ==="
        
        # Simulate the framework move (already done in copy step)
        if [ -f ".architecture/decisions/ArchitectureConsiderations.md" ]; then
          echo "✓ Architecture decisions available"
        else
          echo "✗ Architecture decisions missing"
          exit 1
        fi
        
        # Step 4: Create initial CLAUDE.md content (simulate)
        echo "=== Testing CLAUDE.md Integration ==="
        echo "# CLAUDE.md" > CLAUDE.md
        echo "" >> CLAUDE.md
        echo "# AI Software Architect Framework Usage" >> CLAUDE.md
        echo "Follow these instructions when working with architecture in this project:" >> CLAUDE.md
        echo "" >> CLAUDE.md
        echo "## Architecture Documentation" >> CLAUDE.md
        echo "- Store architectural decisions in \`.architecture/decisions/\`" >> CLAUDE.md
        echo "- Store architectural reviews in \`.architecture/reviews/\`" >> CLAUDE.md
        echo "- Reference architecture members from \`.architecture/members.yml\`" >> CLAUDE.md
        echo "" >> CLAUDE.md
        echo "## Request Recognition" >> CLAUDE.md
        echo "When users request architecture setup, reviews, or recalibration, follow the framework processes." >> CLAUDE.md
        
        if [ -f "CLAUDE.md" ]; then
          echo "✓ CLAUDE.md created"
        else
          echo "✗ CLAUDE.md creation failed"
          exit 1
        fi
        
    - name: Test technology-specific customization
      run: |
        cd test-projects/${{ matrix.project-type }}
        
        echo "=== Testing Technology-Specific Customization ==="
        
        # Create customized members.yml based on project type
        case "${{ matrix.project-type }}" in
          nodejs)
            # Add Node.js specific members
            echo "" >> .architecture/members.yml
            echo "- id: frontend_architect" >> .architecture/members.yml
            echo "  name: \"Alex Chen\"" >> .architecture/members.yml
            echo "  title: \"Frontend Architect\"" >> .architecture/members.yml
            echo "  specialties:" >> .architecture/members.yml
            echo "    - \"React/Next.js Architecture\"" >> .architecture/members.yml
            echo "    - \"State Management\"" >> .architecture/members.yml
            echo "    - \"Performance Optimization\"" >> .architecture/members.yml
            echo "  disciplines:" >> .architecture/members.yml
            echo "    - \"Frontend Development\"" >> .architecture/members.yml
            echo "    - \"User Experience\"" >> .architecture/members.yml
            echo "    - \"Web Performance\"" >> .architecture/members.yml
            echo "  skillsets:" >> .architecture/members.yml
            echo "    - \"JavaScript/TypeScript\"" >> .architecture/members.yml
            echo "    - \"Modern Build Tools\"" >> .architecture/members.yml
            echo "    - \"Component Architecture\"" >> .architecture/members.yml
            echo "  domains:" >> .architecture/members.yml
            echo "    - \"Web Applications\"" >> .architecture/members.yml
            echo "    - \"Single Page Applications\"" >> .architecture/members.yml
            echo "    - \"Progressive Web Apps\"" >> .architecture/members.yml
            echo "  perspective: \"Focuses on scalable frontend architecture and optimal user experience\"" >> .architecture/members.yml
            echo "✓ Node.js specific members added"
            ;;
            
          rails)
            # Add Rails specific members
            echo "" >> .architecture/members.yml
            echo "- id: rails_architect" >> .architecture/members.yml
            echo "  name: \"Morgan Ruby\"" >> .architecture/members.yml
            echo "  title: \"Rails Architect\"" >> .architecture/members.yml
            echo "  specialties:" >> .architecture/members.yml
            echo "    - \"Rails Architecture Patterns\"" >> .architecture/members.yml
            echo "    - \"ActiveRecord Design\"" >> .architecture/members.yml
            echo "    - \"Ruby Performance\"" >> .architecture/members.yml
            echo "  disciplines:" >> .architecture/members.yml
            echo "    - \"Backend Development\"" >> .architecture/members.yml
            echo "    - \"Database Design\"" >> .architecture/members.yml
            echo "    - \"API Architecture\"" >> .architecture/members.yml
            echo "  skillsets:" >> .architecture/members.yml
            echo "    - \"Ruby/Rails Framework\"" >> .architecture/members.yml
            echo "    - \"PostgreSQL/MySQL\"" >> .architecture/members.yml
            echo "    - \"RESTful API Design\"" >> .architecture/members.yml
            echo "  domains:" >> .architecture/members.yml
            echo "    - \"Web Applications\"" >> .architecture/members.yml
            echo "    - \"API Development\"" >> .architecture/members.yml
            echo "    - \"Database Architecture\"" >> .architecture/members.yml
            echo "  perspective: \"Champions Rails conventions and Ruby ecosystem best practices\"" >> .architecture/members.yml
            echo "✓ Rails specific members added"
            ;;
            
          python)
            # Add Python specific members
            echo "" >> .architecture/members.yml
            echo "- id: python_architect" >> .architecture/members.yml
            echo "  name: \"Dr. Patricia Python\"" >> .architecture/members.yml
            echo "  title: \"Python Systems Architect\"" >> .architecture/members.yml
            echo "  specialties:" >> .architecture/members.yml
            echo "    - \"Python Architecture\"" >> .architecture/members.yml
            echo "    - \"Django/Flask Design\"" >> .architecture/members.yml
            echo "    - \"Data Pipeline Architecture\"" >> .architecture/members.yml
            echo "  disciplines:" >> .architecture/members.yml
            echo "    - \"Backend Development\"" >> .architecture/members.yml
            echo "    - \"Data Engineering\"" >> .architecture/members.yml
            echo "    - \"System Integration\"" >> .architecture/members.yml
            echo "  skillsets:" >> .architecture/members.yml
            echo "    - \"Python Ecosystem\"" >> .architecture/members.yml
            echo "    - \"Microservices\"" >> .architecture/members.yml
            echo "    - \"Data Processing\"" >> .architecture/members.yml
            echo "  domains:" >> .architecture/members.yml
            echo "    - \"Web Applications\"" >> .architecture/members.yml
            echo "    - \"Data Systems\"" >> .architecture/members.yml
            echo "    - \"API Services\"" >> .architecture/members.yml
            echo "  perspective: \"Emphasizes Pythonic design principles and scalable data architectures\"" >> .architecture/members.yml
            echo "✓ Python specific members added"
            ;;
        esac
        
    - name: Test file structure validation
      run: |
        cd test-projects/${{ matrix.project-type }}
        
        echo "=== Testing File Structure Validation ==="
        
        # Check required directories
        required_dirs=(".architecture" ".architecture/decisions" ".architecture/reviews" ".coding-assistants")
        for dir in "${required_dirs[@]}"; do
          if [ -d "$dir" ]; then
            echo "✓ Directory $dir exists"
          else
            echo "✗ Directory $dir missing"
            exit 1
          fi
        done
        
        # Check required files
        required_files=(".architecture/members.yml" ".architecture/principles.md" "CLAUDE.md")
        for file in "${required_files[@]}"; do
          if [ -f "$file" ]; then
            echo "✓ File $file exists"
          else
            echo "✗ File $file missing"
            exit 1
          fi
        done
        
    - name: Test command recognition patterns
      run: |
        cd test-projects/${{ matrix.project-type }}
        
        echo "=== Testing Command Recognition Patterns ==="
        
        # Test setup command recognition (simulate)
        setup_patterns=(
          "Setup .architecture"
          "Setup ai-software-architect"
          "Setup software architect"
          "Setup architect"
          "Setup architecture"
          "Customize software architect"
        )
        
        for pattern in "${setup_patterns[@]}"; do
          # Simulate pattern matching
          if [[ "$pattern" =~ ([Ss]etup|[Cc]ustomize).*(architecture|architect) ]]; then
            echo "✓ Pattern '$pattern' would be recognized"
          else
            echo "✗ Pattern '$pattern' not recognized"
            exit 1
          fi
        done
        
        # Test review command patterns
        review_patterns=(
          "Start architecture review for version 1.0.0"
          "Review architecture for user authentication"
          "Ask Security Architect to review these changes"
        )
        
        for pattern in "${review_patterns[@]}"; do
          if [[ "$pattern" =~ [Rr]eview|[Aa]sk.*[Aa]rchitect ]]; then
            echo "✓ Pattern '$pattern' would be recognized"
          else
            echo "✗ Pattern '$pattern' not recognized"
            exit 1
          fi
        done
        
    - name: Test cleanup validation
      run: |
        cd test-projects/${{ matrix.project-type }}
        
        echo "=== Testing Cleanup Validation ==="
        
        # Simulate cleanup process
        cleanup_targets=(".architecture/.git" "INSTALL.md" "USAGE.md" "USAGE-WITH-CLAUDE.md")
        
        for target in "${cleanup_targets[@]}"; do
          if [ ! -e "$target" ]; then
            echo "✓ $target properly cleaned up"
          else
            echo "⚠ $target should be cleaned up during setup"
          fi
        done
        
    - name: Generate test report
      run: |
        cd test-projects/${{ matrix.project-type }}
        
        echo "=== Test Report for ${{ matrix.project-type }} ===" 
        echo "Project Type: ${{ matrix.project-type }}"
        echo "Framework Installation: ✓ Success"
        echo "Technology Detection: ✓ Success"  
        echo "Customization: ✓ Success"
        echo "Command Recognition: ✓ Success"
        echo "File Structure: ✓ Success"
        echo ""
        echo "All Claude Code integration tests passed for ${{ matrix.project-type }} project type."
        
    - name: Verify files before upload
      if: always()
      run: |
        echo "=== Files in test-projects/${{ matrix.project-type }} before upload ==="
        ls -la test-projects/${{ matrix.project-type }}/
        if [ -d "test-projects/${{ matrix.project-type }}/.coding-assistants" ]; then
          echo "✓ .coding-assistants directory exists"
          ls -la test-projects/${{ matrix.project-type }}/.coding-assistants/
        else
          echo "✗ .coding-assistants directory missing"
        fi
        if [ -d "test-projects/${{ matrix.project-type }}/.architecture" ]; then
          echo "✓ .architecture directory exists"
        else
          echo "✗ .architecture directory missing"
        fi

    - name: Upload test artifacts
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: claude-test-${{ matrix.project-type }}
        path: test-projects/${{ matrix.project-type }}/
        retention-days: 7
        include-hidden-files: true

  script-tests:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # --- install-framework.sh tests ---

    - name: "install-framework.sh: success path (manifest-based)"
      run: |
        echo "=== Testing install-framework.sh manifest-based success path ==="
        SCRIPT=".claude/skills/setup-architect/scripts/install-framework.sh"
        PROJ="$(mktemp -d)"
        echo '{}' > "$PROJ/package.json"

        # Use CLONE_DIR_OVERRIDE to point at this repo (which has the manifest)
        OUTPUT=$(CLONE_DIR_OVERRIDE="$(pwd)" bash "$SCRIPT" "$PROJ")

        # Verify tokens
        echo "$OUTPUT" | grep -q "CLONE_SKIPPED" && echo "✓ CLONE_SKIPPED" || { echo "✗ missing CLONE_SKIPPED"; exit 1; }
        echo "$OUTPUT" | grep -q "MANIFEST_OK" && echo "✓ MANIFEST_OK" || { echo "✗ missing MANIFEST_OK"; exit 1; }
        echo "$OUTPUT" | grep -q "INSTALL_OK" && echo "✓ INSTALL_OK" || { echo "✗ missing INSTALL_OK"; exit 1; }
        echo "$OUTPUT" | grep -q "VERIFY_OK" && echo "✓ VERIFY_OK" || { echo "✗ missing VERIFY_OK"; exit 1; }

        # Verify manifest-listed items installed
        test -d "$PROJ/.architecture/templates" && echo "✓ templates dir" || { echo "✗ templates dir"; exit 1; }
        test -d "$PROJ/.architecture/agent_docs" && echo "✓ agent_docs dir" || { echo "✗ agent_docs dir"; exit 1; }
        test -d "$PROJ/.architecture/decisions/adrs" && echo "✓ adrs dir" || { echo "✗ adrs dir"; exit 1; }
        test -d "$PROJ/.architecture/reviews" && echo "✓ reviews dir" || { echo "✗ reviews dir"; exit 1; }
        test -d "$PROJ/.architecture/recalibration" && echo "✓ recalibration dir" || { echo "✗ recalibration dir"; exit 1; }
        test -d "$PROJ/.architecture/comparisons" && echo "✓ comparisons dir" || { echo "✗ comparisons dir"; exit 1; }
        test -f "$PROJ/.architecture/config.yml" && echo "✓ config.yml" || { echo "✗ config.yml"; exit 1; }

        # Verify template files copied
        test -f "$PROJ/.architecture/templates/adr-template.md" && echo "✓ adr template" || { echo "✗ adr template"; exit 1; }
        test -f "$PROJ/.architecture/templates/review-template.md" && echo "✓ review template" || { echo "✗ review template"; exit 1; }
        test -f "$PROJ/.architecture/agent_docs/reference.md" && echo "✓ agent_docs reference" || { echo "✗ agent_docs reference"; exit 1; }

        # Verify NO cruft was copied (framework's own files)
        test ! -f "$PROJ/.architecture/members.yml" && echo "✓ no members.yml (skill creates)" || { echo "✗ members.yml should not be copied"; exit 1; }
        test ! -f "$PROJ/.architecture/principles.md" && echo "✓ no principles.md (skill creates)" || { echo "✗ principles.md should not be copied"; exit 1; }
        test ! -d "$PROJ/.architecture/decisions/adrs/ADR-001-cli-functional-requirements.md" && echo "✓ no framework ADRs" || { echo "✗ framework ADRs leaked"; exit 1; }
        REVIEW_COUNT=$(find "$PROJ/.architecture/reviews" -type f 2>/dev/null | wc -l)
        test "$REVIEW_COUNT" -eq 0 && echo "✓ no framework reviews" || { echo "✗ framework reviews leaked ($REVIEW_COUNT files)"; exit 1; }
        test ! -d "$PROJ/.architecture/research" && echo "✓ no research dir" || { echo "✗ research dir leaked"; exit 1; }
        test ! -f "$PROJ/.architecture/deferrals.md" && echo "✓ no deferrals.md" || { echo "✗ deferrals.md leaked"; exit 1; }

        rm -rf "$PROJ"
        echo "=== manifest-based success path: PASSED ==="

    - name: "install-framework.sh: idempotent (run twice)"
      run: |
        echo "=== Testing install-framework.sh idempotency ==="
        SCRIPT=".claude/skills/setup-architect/scripts/install-framework.sh"
        PROJ="$(mktemp -d)"
        echo '{}' > "$PROJ/package.json"

        # First run
        CLONE_DIR_OVERRIDE="$(pwd)" bash "$SCRIPT" "$PROJ" > /dev/null

        # Modify config to verify it's preserved
        echo "# custom config" >> "$PROJ/.architecture/config.yml"

        # Second run
        OUTPUT=$(CLONE_DIR_OVERRIDE="$(pwd)" bash "$SCRIPT" "$PROJ")

        echo "$OUTPUT" | grep -q "CONFIG_EXISTS" && echo "✓ config preserved" || { echo "✗ config overwritten"; exit 1; }
        grep -q "# custom config" "$PROJ/.architecture/config.yml" && echo "✓ config content intact" || { echo "✗ config content lost"; exit 1; }

        rm -rf "$PROJ"
        echo "=== idempotency test: PASSED ==="

    - name: "install-framework.sh: missing manifest (exit 3)"
      run: |
        echo "=== Testing install-framework.sh missing manifest ==="
        SCRIPT=".claude/skills/setup-architect/scripts/install-framework.sh"
        PROJ="$(mktemp -d)"
        FAKE_CLONE="$(mktemp -d)"
        mkdir -p "$FAKE_CLONE/.architecture"

        set +e
        OUTPUT=$(CLONE_DIR_OVERRIDE="$FAKE_CLONE" bash "$SCRIPT" "$PROJ" 2>&1)
        EXIT_CODE=$?
        set -e

        test "$EXIT_CODE" -eq 3 && echo "✓ exit code 3" || { echo "✗ expected exit 3, got $EXIT_CODE"; exit 1; }
        rm -rf "$PROJ" "$FAKE_CLONE"
        echo "=== missing manifest test: PASSED ==="

    - name: "install-framework.sh: relative path (exit 1)"
      run: |
        echo "=== Testing install-framework.sh relative path ==="
        SCRIPT=".claude/skills/setup-architect/scripts/install-framework.sh"

        set +e
        OUTPUT=$(bash "$SCRIPT" "relative/path" 2>&1)
        EXIT_CODE=$?
        set -e

        test "$EXIT_CODE" -eq 1 && echo "✓ exit code 1" || { echo "✗ expected exit 1, got $EXIT_CODE"; exit 1; }
        echo "=== relative path test: PASSED ==="

    # --- next-adr-number.sh tests ---

    - name: "next-adr-number.sh: sequential default"
      run: |
        echo "=== Testing next-adr-number.sh sequential default ==="
        SCRIPT=".claude/skills/scripts/next-adr-number.sh"
        TMPDIR="$(mktemp -d)"

        # Create structure: architecture/decisions/adrs + config
        mkdir -p "$TMPDIR/decisions/adrs"
        cat > "$TMPDIR/config.yml" << 'YAML'
        adr:
          numbering_format: sequential
        YAML

        # No existing ADRs — should return 001
        OUTPUT=$(bash "$SCRIPT" "$TMPDIR/decisions/adrs")
        test "$OUTPUT" = "ADR-001" && echo "✓ first ADR: ADR-001" || { echo "✗ expected ADR-001, got '$OUTPUT'"; exit 1; }

        # Create ADR-001 and ADR-002
        touch "$TMPDIR/decisions/adrs/ADR-001-first-decision.md"
        touch "$TMPDIR/decisions/adrs/ADR-002-second-decision.md"

        OUTPUT=$(bash "$SCRIPT" "$TMPDIR/decisions/adrs")
        test "$OUTPUT" = "ADR-003" && echo "✓ next after 002: ADR-003" || { echo "✗ expected ADR-003, got '$OUTPUT'"; exit 1; }

        rm -rf "$TMPDIR"
        echo "=== sequential default test: PASSED ==="

    - name: "next-adr-number.sh: sequential custom padding"
      run: |
        echo "=== Testing next-adr-number.sh sequential custom padding ==="
        SCRIPT=".claude/skills/scripts/next-adr-number.sh"
        TMPDIR="$(mktemp -d)"

        mkdir -p "$TMPDIR/decisions/adrs"
        cat > "$TMPDIR/config.yml" << 'YAML'
        adr:
          numbering_format: sequential
          sequential_format: "0000"
        YAML

        OUTPUT=$(bash "$SCRIPT" "$TMPDIR/decisions/adrs")
        test "$OUTPUT" = "ADR-0001" && echo "✓ 4-digit padding: ADR-0001" || { echo "✗ expected ADR-0001, got '$OUTPUT'"; exit 1; }

        rm -rf "$TMPDIR"
        echo "=== sequential custom padding test: PASSED ==="

    - name: "next-adr-number.sh: date-based"
      run: |
        echo "=== Testing next-adr-number.sh date-based ==="
        SCRIPT=".claude/skills/scripts/next-adr-number.sh"
        TMPDIR="$(mktemp -d)"

        mkdir -p "$TMPDIR/decisions/adrs"
        cat > "$TMPDIR/config.yml" << 'YAML'
        adr:
          numbering_format: date-based
        YAML

        EXPECTED="ADR-$(date +"%Y%m%d")"
        OUTPUT=$(bash "$SCRIPT" "$TMPDIR/decisions/adrs")
        test "$OUTPUT" = "$EXPECTED" && echo "✓ date-based: $EXPECTED" || { echo "✗ expected $EXPECTED, got '$OUTPUT'"; exit 1; }

        rm -rf "$TMPDIR"
        echo "=== date-based test: PASSED ==="

    - name: "next-adr-number.sh: date-based custom format"
      run: |
        echo "=== Testing next-adr-number.sh date-based custom format ==="
        SCRIPT=".claude/skills/scripts/next-adr-number.sh"
        TMPDIR="$(mktemp -d)"

        mkdir -p "$TMPDIR/decisions/adrs"
        cat > "$TMPDIR/config.yml" << 'YAML'
        adr:
          numbering_format: date-based
          date_format: "%Y-%m-%d"
        YAML

        EXPECTED="ADR-$(date +"%Y-%m-%d")"
        OUTPUT=$(bash "$SCRIPT" "$TMPDIR/decisions/adrs")
        test "$OUTPUT" = "$EXPECTED" && echo "✓ custom date: $EXPECTED" || { echo "✗ expected $EXPECTED, got '$OUTPUT'"; exit 1; }

        rm -rf "$TMPDIR"
        echo "=== date-based custom format test: PASSED ==="

    - name: "next-adr-number.sh: collision detection (exit 2)"
      run: |
        echo "=== Testing next-adr-number.sh collision detection ==="
        SCRIPT=".claude/skills/scripts/next-adr-number.sh"
        TMPDIR="$(mktemp -d)"

        mkdir -p "$TMPDIR/decisions/adrs"
        cat > "$TMPDIR/config.yml" << 'YAML'
        adr:
          numbering_format: sequential
        YAML

        # Create existing ADR with topic
        touch "$TMPDIR/decisions/adrs/ADR-001-use-postgres.md"

        set +e
        OUTPUT=$(bash "$SCRIPT" "$TMPDIR/decisions/adrs" "use-postgres" 2>&1)
        EXIT_CODE=$?
        set -e

        # Script should return next number (002) without collision since prefix differs
        # But if we force same prefix: create scenario where next is 002 and topic matches
        touch "$TMPDIR/decisions/adrs/ADR-002-caching-strategy.md"
        set +e
        OUTPUT=$(bash "$SCRIPT" "$TMPDIR/decisions/adrs" "caching-strategy" 2>/dev/null)
        EXIT_CODE=$?
        set -e

        # Next number would be 003, no collision with "caching-strategy" at 003
        # To get actual collision: create ADR-003-caching-strategy.md
        touch "$TMPDIR/decisions/adrs/ADR-003-caching-strategy.md"
        set +e
        OUTPUT=$(bash "$SCRIPT" "$TMPDIR/decisions/adrs" "caching-strategy" 2>&1)
        EXIT_CODE=$?
        set -e

        # Hmm, the script generates prefix 004 (next after 003), not 003
        # Collision only happens if generated prefix matches existing file
        # For sequential, this can't happen by definition (always increments)
        # Collision detection is mainly for date-based where two ADRs on same day with same topic
        echo "✓ sequential collision: N/A (always increments)"

        # Test date-based collision
        cat > "$TMPDIR/config.yml" << 'YAML'
        adr:
          numbering_format: date-based
        YAML

        TODAY=$(date +"%Y%m%d")
        touch "$TMPDIR/decisions/adrs/ADR-${TODAY}-use-redis.md"

        set +e
        bash "$SCRIPT" "$TMPDIR/decisions/adrs" "use-redis" 2>/dev/null
        EXIT_CODE=$?
        set -e

        test "$EXIT_CODE" -eq 2 && echo "✓ date collision detected: exit 2" || { echo "✗ expected exit 2, got $EXIT_CODE"; exit 1; }

        rm -rf "$TMPDIR"
        echo "=== collision detection test: PASSED ==="

    - name: "next-adr-number.sh: missing config defaults"
      run: |
        echo "=== Testing next-adr-number.sh missing config ==="
        SCRIPT=".claude/skills/scripts/next-adr-number.sh"
        TMPDIR="$(mktemp -d)"

        # Create adrs dir but no config.yml
        mkdir -p "$TMPDIR/decisions/adrs"

        OUTPUT=$(bash "$SCRIPT" "$TMPDIR/decisions/adrs")
        test "$OUTPUT" = "ADR-001" && echo "✓ default without config: ADR-001" || { echo "✗ expected ADR-001, got '$OUTPUT'"; exit 1; }

        rm -rf "$TMPDIR"
        echo "=== missing config defaults test: PASSED ==="

    - name: "next-adr-number.sh: date-prefixed-sequential (default)"
      run: |
        echo "=== Testing next-adr-number.sh date-prefixed-sequential ==="
        SCRIPT=".claude/skills/scripts/next-adr-number.sh"
        TMPDIR="$(mktemp -d)"

        mkdir -p "$TMPDIR/decisions/adrs"
        cat > "$TMPDIR/config.yml" << 'YAML'
        adr:
          numbering_format: date-prefixed-sequential
        YAML

        TODAY=$(date +"%Y%m%d")

        # No existing ADRs -> YYYYMMDD_ADR-001
        OUTPUT=$(bash "$SCRIPT" "$TMPDIR/decisions/adrs")
        test "$OUTPUT" = "${TODAY}_ADR-001" && echo "✓ first: ${TODAY}_ADR-001" || { echo "✗ expected ${TODAY}_ADR-001, got '$OUTPUT'"; exit 1; }

        # Sequential number tracks the max ADR-NNN even across other-day date prefixes
        touch "$TMPDIR/decisions/adrs/20260101_ADR-001-a.md"
        touch "$TMPDIR/decisions/adrs/20260101_ADR-002-b.md"
        OUTPUT=$(bash "$SCRIPT" "$TMPDIR/decisions/adrs")
        test "$OUTPUT" = "${TODAY}_ADR-003" && echo "✓ next after 002: ${TODAY}_ADR-003" || { echo "✗ expected ${TODAY}_ADR-003, got '$OUTPUT'"; exit 1; }

        rm -rf "$TMPDIR"
        echo "=== date-prefixed-sequential test: PASSED ==="

  cross-compatibility-test:
    runs-on: ubuntu-latest
    needs: claude-setup-tests
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Download all test artifacts
      uses: actions/download-artifact@v4
      with:
        path: test-artifacts/
        
    - name: Test cross-assistant compatibility
      run: |
        echo "=== Testing Cross-Assistant Compatibility ==="
        
        # Test that architecture configured by Claude can be used by other assistants
        for project_type in nodejs rails python generic; do
          if [ -d "test-artifacts/claude-test-$project_type" ]; then
            cd "test-artifacts/claude-test-$project_type"

            echo "Testing $project_type compatibility..."
            echo "Contents of test-artifacts/claude-test-$project_type:"
            ls -la

            # Verify Cursor can access the architecture
            if [ -d ".coding-assistants/cursor" ]; then
              echo "✓ Cursor configurations present"
            else
              echo "✗ Cursor configurations missing"
              exit 1
            fi
            
            # Verify Codex can access the architecture  
            if [ -d ".coding-assistants/codex" ]; then
              echo "✓ Codex configurations present"
            else
              echo "✗ Codex configurations missing"
              exit 1
            fi
            
            # Test shared architecture understanding
            if [ -f ".architecture/members.yml" ] && [ -f ".architecture/principles.md" ]; then
              echo "✓ Shared architecture files accessible"
            else
              echo "✗ Shared architecture files missing"
              exit 1
            fi
            
            cd ../..
          fi
        done
        
        echo "All cross-compatibility tests passed."