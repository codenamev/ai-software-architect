name: Claude Code Plugin Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate-plugin:
    name: Validate plugin (real signal)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Install tools dependencies
        working-directory: tools
        run: npm ci

      - name: Install MCP dependencies
        working-directory: mcp
        run: npm install --prefer-offline

      - name: Verify the published npm package matches mcp/package.json
        # main only: a version bump may land before it's published, but main
        # stays red until `npm publish` catches up — the drift behind #27.
        if: github.event_name == 'push'
        working-directory: mcp
        run: |
          name="$(node -p "require('./package.json').name")"
          repo="$(node -p "require('./package.json').version")"
          published="$(npm view "$name" version)"
          echo "repo=$repo published=$published"
          [ "$repo" = "$published" ] || {
            echo "::error::mcp/package.json is $repo but npm serves $published — run: cd mcp && npm publish"
            exit 1
          }

      - name: Lint JSON config files
        run: |
          for f in \
            .claude-plugin/plugin.json \
            .claude-plugin/marketplace.json \
            hooks/hooks.json \
            .claude/settings.json; do
            echo "Parsing $f"
            node -e "JSON.parse(require('fs').readFileSync('$f','utf8'))"
          done

      - name: Run tools unit tests
        working-directory: tools
        run: npm test

      # The tools suite reaches the MCP server by importing the class, which
      # never resolves @modelcontextprotocol/sdk. This step spawns the server
      # over a real stdio transport so the SDK, the request handlers and the
      # entrypoint are covered too.
      - name: Run MCP protocol smoke test
        working-directory: mcp
        run: npm test

      - name: Validate every ADR against the template
        working-directory: tools
        run: node cli.js validate-adr

      - name: Verify subagents are in sync with members.yml
        working-directory: tools
        run: node cli.js generate-subagents --check

      - name: Verify framework source discovery resolves to the repo root
        env:
          CLAUDE_PLUGIN_ROOT: ${{ github.workspace }}
        working-directory: tools
        run: |
          RESOLVED=$(node cli.js find-source)
          test "$RESOLVED" = "${{ github.workspace }}" \
            || { echo "find-source returned $RESOLVED, expected ${{ github.workspace }}"; exit 1; }

      - name: Verify documentation links resolve
        working-directory: tools
        run: node cli.js validate

      - name: Verify required plugin layout
        run: |
          for skill in setup-architect architecture-review create-adr \
                       list-members architecture-status specialist-review \
                       pragmatic-guard; do
            test -f "skills/$skill/SKILL.md" \
              || { echo "Missing skills/$skill/SKILL.md"; exit 1; }
          done
          for member in systems-architect domain-expert security-specialist \
                        maintainability-expert performance-specialist \
                        implementation-strategist ai-engineer pragmatic-enforcer; do
            test -f "agents/$member.md" \
              || { echo "Missing agents/$member.md"; exit 1; }
          done

  fixture-compatibility:
    name: Fixture project compatibility
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project-type: [nodejs, rails, python, generic]
    steps:
      - uses: actions/checkout@v7

      - name: Create fixture project
        run: |
          mkdir -p "test-projects/${{ matrix.project-type }}"
          cd "test-projects/${{ matrix.project-type }}"
          case "${{ matrix.project-type }}" in
            nodejs)  echo '{"name":"test-app","version":"1.0.0"}' > package.json ;;
            rails)   printf 'source "https://rubygems.org"\ngem "rails"\n' > Gemfile ;;
            python)  echo 'flask==3.0.0' > requirements.txt ;;
            generic) echo '# Generic project' > README.md ;;
          esac

      - name: Copy framework artifacts the fixture would receive
        run: |
          cp -r .architecture "test-projects/${{ matrix.project-type }}/"
          cp -r .coding-assistants "test-projects/${{ matrix.project-type }}/"

      - name: Verify required files exist in fixture
        run: |
          cd "test-projects/${{ matrix.project-type }}"
          test -f .architecture/members.yml
          test -f .architecture/principles.md
          test -f .architecture/config.yml
          test -d .architecture/decisions/adrs
          test -d .architecture/templates
          test -d .coding-assistants/cursor
          test -d .coding-assistants/codex

  plugin-eval:
    name: Plugin eval suite (manual)
    # Real-CLI runs cost API credits and require a secret; gated to
    # workflow_dispatch so push/PR runs stay free. ADR-012 Phase 5 documents
    # this gating decision. This job replaced the one-prompt claude-smoke
    # job (#60): it runs evals/ with and without the plugin and reports the
    # delta. It is a release-checklist step, not a merge gate - see AGENTS.md.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      # The suite grants Bash/Write/Edit (setup and create-adr write files),
      # so every run needs Claude Code's OS sandbox backend. On Linux that is
      # bubblewrap + socat; without them the run is refused, not unconfined.
      - name: Install sandbox backend
        run: sudo apt-get update -qq && sudo apt-get install -y -qq bubblewrap socat

      - name: Run plugin evals with a no-plugin baseline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "ANTHROPIC_API_KEY secret is not configured; skipping plugin evals."
            exit 0
          fi
          # Both models pinned so scores stay comparable across runs. The cost
          # ceiling is a hard stop (exit 2, partial results still written).
          # --threshold 0.8: a case passes when its with-plugin score is >= 0.8.
          claude plugin eval . \
            --trust-plugin \
            --scaffold \
            --allow-tools Write Edit Bash \
            --ablation with-without \
            --model claude-sonnet-5 \
            --judge-model claude-haiku-4-5 \
            --threshold 0.8 \
            --max-cost-usd 3 \
            --json evals/results/last.json \
            --report evals/results/report.html \
            --no-publish

      - name: Upload eval results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plugin-eval-results
          path: evals/results/
          if-no-files-found: ignore
